[project]
name = "filament-manager-backend"
version = "0.1.0"
description = "Local 3D printer filament management backend for Bambu Lab LAN MQTT."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.4.0",
    "paho-mqtt>=2.1.0",
    "gradio>=4.44.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filament_manager"]

[tool.pytest.ini_options]
testpaths = ["../test"]
pythonpath = ["src"]
addopts = "-q"
