[project]
name = "filament-manager-mcp"
version = "0.1.0"
description = "Read-only MCP tools for FilamentManager diagnostics."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
filament-manager-mcp = "filament_manager_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filament_manager_mcp"]

[tool.pytest.ini_options]
testpaths = ["../../../test"]
pythonpath = ["../../.."]
addopts = "-q"
